# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Fabric / Loom versions for ChaosLedger on Minecraft 26.3.
minecraft_version=26.3
# Mojang official mappings (Mojmap) are pulled automatically by Loom via
#   mappings loom.layered() { officialMojangMappings(); parchment(...) }
# in build.gradle. Yarn is deprecated for 26.x — Mojmap is the canonical standard.
# Parchment adds human-readable parameter names + javadoc on top of Mojmap.
# Replace parchment_build with the actual build published for 26.3 at
# https://maven.parchmentmc.org/org/parchmentmc/data/parchment-26.3/
# If no Parchment build for 26.3 exists yet, comment out the parchment(...) line
# in build.gradle to fall back to plain Mojmap (parameter names will be stubs).
parchment_build=2026.10.01
loader_version=0.17.0

# Fabric Loom
loom_version=1.17.5

# Mod metadata
mod_version=0.1.0
maven_group=dev.chaosledger
archives_base_name=chaosledger

# Java target. Java 25 ships with the new language features we use (records, sealed types, pattern matching).
java_version=25

# Fabric API - use the build that targets 26.3.
fabric_version=0.130.0+26.3
