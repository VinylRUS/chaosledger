# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Fabric / Loom versions for ChaosLedger on Minecraft 26.3.
# These match the official fabric-example-mod 26.3 branch.
minecraft_version=26.3
loader_version=0.20.1

# Fabric Loom — 1.19-SNAPSHOT is the recommended version for MC 26.x
# (see https://fabricmc.net/develop). Requires Gradle 9.4+ and Java 21+.
# Loom 1.19 consumes Mojang's official names *natively* because 26.x ships
# un-obfuscated — there is NO mappings line in build.gradle and NO
# yarn_mappings / parchment_build property. Yarn is deprecated for 26.x.
loom_version=1.19-SNAPSHOT

# Mod metadata
mod_version=0.1.0
maven_group=dev.chaosledger
archives_base_name=chaosledger

# Java target. Java 25 ships with the new language features we use (records, sealed types, pattern matching).
java_version=25

# Fabric API — note the property name is fabric_api_version (underscore) on 26.x.
# Check the latest build at https://fabricmc.net/develop/
fabric_api_version=0.166.2+26.3
