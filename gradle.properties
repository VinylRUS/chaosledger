# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Fabric / Loom versions for ChaosLedger on Minecraft 26.3.
minecraft_version=26.3
# Modern Yarn mappings (named mojang + yarn) - use the build that matches 26.3.
# NOTE: replace with the exact build published for 26.3 if the one below is not yet released.
yarn_mappings=26.3+build.1
loader_version=0.17.0

# Fabric Loom
loom_version=1.17.5

# Mod metadata
mod_version=0.1.0
maven_group=dev.chaosledger
archives_base_name=chaosledger

# Java target. Java 25 ships with the new language features we use (records, sealed types, pattern matching).
java_version=25

# Fabric API - use the build that targets 26.3.
fabric_version=0.130.0+26.3
