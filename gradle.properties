# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Fabric / Loom versions for ChaosLedger on Minecraft 26.3.
# These match the official fabric-example-mod 26.3 branch.
minecraft_version=26.3
loader_version=0.20.1

# Fabric Loom — 1.19-SNAPSHOT is the recommended version for MC 26.x
# (see https://fabricmc.net/develop). Requires Gradle 9.4+ and Java 21+.
loom_version=1.19-SNAPSHOT

# MC 26.x ships UN-OBFUSCATED (since 1.21.11 snapshots, release-time cutoff
# 2025-11-01). Mojang no longer publishes client_mappings/server_mappings
# ProGuard files in the version manifest — so a `mappings loom.officialMojangMappings()`
# line in build.gradle THROWS "Failed to find official mojang mappings for 26.3".
#
# This flag flips Loom's `disableObfuscation()` to true, activating its "debof"
# (de-obfuscated) code path that skips the mappings/remap pipeline entirely.
# Source: net.fabricmc.loom.extension.LoomGradleExtensionImpl reads
# Constants.Properties.DISABLE_OBFUSCATION = "fabric.loom.disableObfuscation".
# Without it, Loom goes down the legacy obfuscated path and crashes because the
# 26.3 manifest has no client_mappings download entry (only client + server jars).
fabric.loom.disableObfuscation=true

# Mod metadata
# v0.2.0: WebSocket reverse-tunnel client (mod → bot outbound) so the mod works
# on shared Minecraft hosting (Exaroton) where only the MC port is reachable.
# Default currency renamed to «медяк» (медяк/медяка/медяков) with Russian pluralisation.
mod_version=0.2.0
maven_group=dev.chaosledger
archives_base_name=chaosledger

# Java target. Java 25 ships with the new language features we use (records, sealed types, pattern matching).
java_version=25

# Fabric API — note the property name is fabric_api_version (underscore) on 26.x.
# Check the latest build at https://fabricmc.net/develop/
fabric_api_version=0.166.2+26.3
