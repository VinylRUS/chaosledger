name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag / version to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.14 --distribution-type bin
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build with version override
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.tag }}
        run: ./gradlew build --stacktrace --no-daemon

      - name: Print resolved version
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.tag }}
        run: ./gradlew printVersion --no-daemon

      - name: Stage artifacts
        id: stage
        run: |
          mkdir -p staging
          cp build/libs/chaosledger-*.jar staging/
          # Drop the sources jar from the release assets to keep it lean? Keep it: developers want it.
          ls -la staging/
          echo "version=$(./gradlew -q printVersion --no-daemon | sed -n 's/^VERSION=//p')" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          {
            echo "## ChaosLedger ${{ steps.tag.outputs.tag }}"
            echo ""
            echo "Authoritative server-side Fabric mod for Minecraft 26.3."
            echo ""
            echo "### Install"
            echo "1. Download \`chaosledger-*.jar\` below."
            echo "2. Drop it into your server's \`mods/\` folder alongside the matching Fabric API."
            echo "3. Start the server — \`chaosledger.db\` and \`config/chaosledger/chaosledger.properties\` are created automatically."
            echo ""
            echo "### Changes since ${PREV_TAG:-initial commit}"
            echo ""
            echo '```'
            git log --pretty=format:'- %s (%h)' "${RANGE}"
            echo '```'
            echo ""
            echo "Full changelog: https://github.com/${{ github.repository }}/commits/${{ steps.tag.outputs.tag }}"
          } > release_notes.md
          echo "Generated release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ChaosLedger ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: |
            staging/chaosledger-*.jar
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: false
          make_latest: 'true'
