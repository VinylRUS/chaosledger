name: Build

on:
  push:
    branches: [ main, master, develop ]
    tags-ignore: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java${{ matrix.java }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-java${{ matrix.java }}-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate Gradle wrapper (fallback if missing)
        # The repo commits gradle-wrapper.jar, but we regenerate it as a safety net.
        # Gradle 9.8.2 is required for Loom 1.19 on JDK 25 — Gradle 8.x cannot read
        # Java 25 class files (major version 69).
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing - generating with system gradle"
            gradle wrapper --gradle-version 9.8.2 --distribution-type bin
          fi
          ls -la gradle/wrapper/

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon

      - name: Print resolved version
        run: ./gradlew printVersion --no-daemon

      - name: Upload jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chaosledger-jars-java${{ matrix.java }}
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7
