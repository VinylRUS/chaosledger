plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Allow CI to override the version from a git tag (e.g. RELEASE_VERSION=v0.1.0 -> 0.1.0).
def resolvedVersion = System.getenv('RELEASE_VERSION') ?: project.mod_version
if (resolvedVersion?.startsWith('v')) {
    resolvedVersion = resolvedVersion.substring(1)
}
version = resolvedVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // maven.fabricmc.net is added by Loom automatically.
}

loom {
    // ChaosLedger is server-authoritative — there is no client-side source set.
    // We do NOT call splitEnvironmentSourceSets() (that is the Loom 1.19 method
    // which ENABLES split; the old `splitEnvironmentSourceSets = false` property
    // syntax does not exist on LoomGradleExtensionImpl and throws
    // MissingPropertyException). The default (no split) is exactly what we want.
    mods {
        "chaosledger" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft 26.x ships UN-OBFUSCATED (since 1.21.11 snapshots). Mojang no longer
    // publishes client_mappings ProGuard files, so there is NO `mappings` line here:
    //   - `mappings loom.officialMojangMappings()` THROWS "Failed to find official
    //     mojang mappings for 26.3" (no client_mappings in the 26.3 version manifest).
    //   - `loom.layered { officialMojangMappings(); parchment(...) }` same problem,
    //     plus Parchment isn't published for 26.x anyway.
    //
    // Instead, Loom's "debof" (de-obfuscated) code path is activated by the Gradle
    // property `fabric.loom.disableObfuscation=true` in gradle.properties. That flips
    // `disableObfuscation()` to true, and CompileConfiguration.provideMinecraft() then
    // skips the MAPPINGS configuration entirely (it consults the optional ANNOTATIONS
    // config instead, which is empty and fine).
    //
    // Scope note: on 26.x the official template uses plain `implementation`
    // (not `modImplementation`) for loader + fabric-api.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Gson is shipped with the Minecraft distribution (com.google.gson) - no extra dependency needed.

    // SQLite JDBC driver - bundled inside the jar so the server does not need an external copy.
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    include 'org.xerial:sqlite-jdbc:3.46.1.3'
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.java_version)
    it.options.compilerArgs += ['-parameters']
}

java {
    sourceCompatibility = JavaLanguageVersion.of(project.java_version)
    targetCompatibility = JavaLanguageVersion.of(project.java_version)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        // Include LICENSE if present.
    }
    manifest {
        attributes([
                'Specification-Title'     : project.archives_base_name,
                'Specification-Vendor'    : 'ChaosLedger Project',
                'Specification-Version'   : project.mod_version,
                'Implementation-Title'    : project.archives_base_name,
                'Implementation-Vendor'   : 'ChaosLedger Project',
                'Implementation-Version'  : project.mod_version,
                'Main-Class'              : 'dev.chaosledger.chaosledger.bootstrap.Standalone',
                'Multi-Release'           : 'true'
        ])
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            artifactId = project.archives_base_name
        }
    }
}

// Helper task used by CI to print the resolved version (after RELEASE_VERSION override).
tasks.register('printVersion') {
    doLast {
        println "VERSION=${project.version}"
    }
}
