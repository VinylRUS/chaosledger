plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Allow CI to override the version from a git tag (e.g. RELEASE_VERSION=v0.1.0 -> 0.1.0).
def resolvedVersion = System.getenv('RELEASE_VERSION') ?: project.mod_version
if (resolvedVersion?.startsWith('v')) {
    resolvedVersion = resolvedVersion.substring(1)
}
version = resolvedVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Additional repositories (maven.fabricmc.net is added by Loom automatically)
    maven { url = 'https://maven.fabricmc.net/' }
    // ParchmentMC — used for parameter names + javadoc layered on top of Mojang official mappings.
    maven { url = 'https://maven.parchmentmc.org/' }
}

loom {
    // Split client/server sources are not required for a server-authoritative mod,
    // but Loom still wants the mixin/refmap config if present. We keep it minimal.
    splitEnvironmentSourceSets = false
    mods {
        "chaosledger" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft, Mojang official mappings (Mojmap) and Fabric Loader come from Loom.
    // Mojmap is preferred over Yarn for an authoritative server-side mod: it uses
    // Mojang's official names, matches vanilla source 1:1, and removes ambiguity
    // for maintainers reading the decompiled game code.
    //
    // Parchment is layered on top of Mojmap to provide human-readable parameter
    // names and javadoc — without it, every parameter would be a stub like `p_123456_`.
    //
    // NOTE: Yarn is deprecated for Minecraft 26.x (the game ships un-obfuscated
    // since 26.1, so Mojang names are the canonical standard). Mojmap is the only
    // forward-looking choice. If Parchment has not yet published a 26.3 build,
    // either fall back to plain `loom.officialMojangMappings()` or pin to the
    // latest 1.21.x parchment build that resolves against 26.3's merged jar.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_build}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Gson is shipped with the Minecraft distribution (com.google.gson) - no extra dependency needed.

    // SQLite JDBC driver - bundled inside the jar so the server does not need an external copy.
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    include 'org.xerial:sqlite-jdbc:3.46.1.3'
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.java_version)
    it.options.compilerArgs += ['-parameters']
}

java {
    sourceCompatibility = JavaLanguageVersion.of(project.java_version)
    targetCompatibility = JavaLanguageVersion.of(project.java_version)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        // Include LICENSE if present.
    }
    manifest {
        attributes([
                'Specification-Title'     : project.archives_base_name,
                'Specification-Vendor'    : 'ChaosLedger Project',
                'Specification-Version'   : project.mod_version,
                'Implementation-Title'    : project.archives_base_name,
                'Implementation-Vendor'   : 'ChaosLedger Project',
                'Implementation-Version'  : project.mod_version,
                'Main-Class'              : 'dev.chaosledger.chaosledger.bootstrap.Standalone',
                'Multi-Release'           : 'true'
        ])
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            artifactId = project.archives_base_name
        }
    }
}

// Helper task used by CI to print the resolved version (after RELEASE_VERSION override).
tasks.register('printVersion') {
    doLast {
        println "VERSION=${project.version}"
    }
}
